[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tecad"
version = "0.1.0"
description = "Target-centred candidate-set anomaly detection and paper experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "pandas==2.2.3", "scipy==1.17.1",
  "scikit-learn==1.5.2", "pyarrow==17.0.0", "PyYAML>=6"
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "contourpy<1.4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tecad*", "experiments*", "plots*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
